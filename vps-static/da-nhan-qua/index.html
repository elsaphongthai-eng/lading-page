<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đã nhận quà · Elsa Phương</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500&family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#D81B60;--pink-dark:#AD1457;--brown:#4A3429;--cream:#FFF9F5;
    --cream-2:#FDECE3;--gold:#E8B547;
    --serif:'Playfair Display',serif;--body:'Lora',serif;
    --sans:'Quicksand',sans-serif;--script:'Dancing Script',cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);background:var(--cream);color:var(--brown);line-height:1.65;min-height:100vh}
  a{color:inherit}

  .top-bar{background:#fff;border-bottom:1px solid #F0E0D0;padding:14px 20px}
  .top-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:var(--serif);font-size:1.3rem;color:var(--pink);font-weight:700;text-decoration:none}
  .logo em{font-family:var(--script);font-style:normal;font-size:.75rem;color:var(--brown);display:block;margin-top:-2px}
  .back-home{font-family:var(--sans);font-size:.88rem;color:var(--brown);opacity:.7;text-decoration:none}

  .hero{padding:56px 20px 24px;text-align:center;background:linear-gradient(180deg,var(--cream-2) 0%,transparent 100%)}
  .hero .flower{font-size:2.4rem;margin-bottom:8px;animation:bounce 1.5s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .hero h1{font-family:var(--serif);font-size:2rem;line-height:1.25;color:var(--pink);margin-bottom:14px;letter-spacing:.3px}
  .hero .greeting{font-size:1.05rem;color:var(--brown);max-width:560px;margin:0 auto}
  .hero .greeting strong{color:var(--pink-dark)}

  .container{max-width:720px;margin:20px auto 60px;padding:0 20px}

  .check-email{
    background:linear-gradient(135deg,#FFF3E0 0%,#FFE0B2 100%);
    border-left:5px solid var(--gold);border-radius:12px;
    padding:18px 22px;margin-bottom:32px;display:flex;align-items:flex-start;gap:14px;
  }
  .check-email .icon{font-size:1.8rem;flex-shrink:0}
  .check-email .body{flex:1}
  .check-email .head{font-family:var(--sans);font-weight:700;color:#7B5A0D;margin-bottom:4px;font-size:.98rem}
  .check-email .sub{color:#5C4404;font-size:.92rem}

  .section-title{
    font-family:var(--serif);font-size:1.5rem;color:var(--brown);text-align:center;
    margin-bottom:6px;font-weight:700;
  }
  .section-sub{text-align:center;color:var(--brown);opacity:.72;font-size:.95rem;margin-bottom:26px}

  .gift-list{display:flex;flex-direction:column;gap:18px;margin-bottom:36px}
  .gift-item{
    background:#fff;border-radius:16px;padding:24px 26px;box-shadow:0 10px 26px rgba(74,52,41,.08);
    border:2px solid transparent;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;
  }
  .gift-item:hover{transform:translateY(-3px);border-color:var(--pink);box-shadow:0 16px 36px rgba(216,27,96,.15)}
  .gift-item .num{
    position:absolute;top:20px;right:22px;font-family:var(--serif);font-size:2rem;font-weight:700;
    color:var(--pink);opacity:.15;line-height:1;
  }
  .gift-tag{
    display:inline-block;background:var(--cream-2);color:var(--pink-dark);
    font-family:var(--sans);font-weight:700;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;
    padding:4px 10px;border-radius:10px;margin-bottom:10px;
  }
  .gift-title{font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--brown);margin-bottom:8px;padding-right:36px;line-height:1.35}
  .gift-pwd{background:var(--cream);border:1px dashed var(--pink);padding:10px 14px;border-radius:8px;margin:12px 0;font-family:var(--sans);font-size:.9rem;color:var(--brown);display:flex;align-items:center;gap:8px}
  .gift-pwd code{background:var(--pink);color:#fff;padding:3px 10px;border-radius:5px;font-family:'SF Mono',Menlo,monospace;font-weight:700;font-size:.98rem}
  .gift-btn{
    display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--pink),var(--pink-dark));
    color:#fff;font-family:var(--sans);font-weight:700;font-size:.95rem;padding:11px 22px;border-radius:24px;
    text-decoration:none;box-shadow:0 6px 18px rgba(216,27,96,.28);transition:transform .2s,box-shadow .2s;
  }
  .gift-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(216,27,96,.42)}

  .practice-note{
    background:#F1F8E9;border-left:4px solid #4CAF50;padding:14px 18px;border-radius:10px;
    color:#33691E;text-align:center;margin-bottom:26px;font-family:var(--sans);font-weight:500;
  }

  .signature{text-align:center;padding:24px 20px;font-family:var(--body);color:var(--brown)}
  .signature .heart{color:var(--pink);font-size:1.2rem}
  .signature .name{font-family:var(--script);font-size:1.8rem;color:var(--pink);margin-top:8px}

  .contact-box{
    background:#fff;border-radius:14px;padding:20px 24px;text-align:center;box-shadow:0 8px 22px rgba(74,52,41,.08);
    margin-top:30px;
  }
  .contact-box .em{font-size:1.4rem}
  .contact-box .t{font-family:var(--sans);font-weight:600;color:var(--brown);margin-bottom:6px;font-size:.95rem}
  .contact-box .phone{font-family:var(--sans);font-weight:700;color:var(--pink);font-size:1.3rem;letter-spacing:.5px}

  .cta-community{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:#0068FF;color:#fff !important;font-family:var(--sans);font-weight:700;
    padding:14px 26px;border-radius:28px;text-decoration:none;margin:24px auto 0;max-width:340px;
    box-shadow:0 8px 22px rgba(0,104,255,.28);transition:transform .2s,box-shadow .2s;
  }
  .cta-community:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,104,255,.4)}

  @media(max-width:600px){
    .hero h1{font-size:1.55rem}
    .gift-item{padding:20px}
    .gift-title{font-size:1.05rem;padding-right:26px}
  }
</style>

<script>
  // Lấy tên từ sessionStorage nếu có
  try {
